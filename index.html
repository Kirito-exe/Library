<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheets/css-reset.css">
    <link rel="stylesheet" href="stylesheets/style.css">
    <title>Library</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Library</h2>
            <button id="addBook">add+</button>
        </div>
        <div class="contents">
            
        </div>
        <div class="footer">
            <div>Made by Kirito(Discord:@rtrd_abhii)</div>
        </div>
    </div>
    <dialog id="addBookDialog" closedby="any">
            <form method="dialog">
                <div class="form-row" id="name-form-row">
                    <label for="book-name">Name*:</label>
                    <input type="text" id="book-name" name="book-name" required/>
                    <div></div>
                </div><div class="form-row" id="author-form-row">
                    <label for="author">Author*:</label>
                    <input autocomplete="off" type="text" id="author" name="author" required/>
                    <div></div>
                </div>
                </div>
                <div class="form-row">
                    <label for="pages">Pages:</label>
                    <input type="number" id="pages" name="pages" min="0" max="11,000" step="1"/>
                </div>
                </div>
                <fieldset>
                    <legend>Read Status*:</legend>
                    <ul>
                        <li>
                            <label for="readdone">Read</label>
                            <input type="radio" id="readdone" name="readStatus" value="done reading" required/>
                        </li>
                        <li>
                            <label for="readnotdone">Not Read</label>
                            <input type="radio" id="readnotdone" name="readStatus" value="not done reading" checked required/>
                        </li>
                    </ul>
                </fieldset>
                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button id="close" >Close </button>
                </div>
            </form>
    </dialog>
    
    <script src="script.js">
    </script>
</body>
</html>
